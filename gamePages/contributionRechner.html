<!doctype html>
<html lang="en">

<body>
    <table>
        <thead>
            <tr id="colHeads">
                <th scope="col" class="colTitle init-val">Initial Value</th>
                <th scope="col" class="colTitle var-1">Variant 1</th>
                <th scope="col" class="colTitle mult-var-1">Multiplier V 1</th>
            </tr>
        </thead>
        <tbody>
            <tr id="rowSales">
                <th class="rowTitle">Sales</th>
                <td class="sales init-val"></td>
                <td class="sales var-1"></td>
                <td class="sales mult-var-1"></td>
            </tr>
            <tr id="rowVarMan">
                <th class="rowTitle">Variable Manufacturing Costs</th>
                <td class="varMan init-val"></td>
                <td class="varMan var-1"></td>
                <td class="varMan mult-var-1"></td>
            </tr>
            <tr id="rowVarAd">
                <th class="rowTitle">Variable Selling/Admin Costs</th>
                <td class="varAd init-val"></td>
                <td class="varAd var-1"></td>
                <td class="varAd mult-var-1"></td>
            </tr>
            <tr id="rowTotalVar">
                <th class="rowTitle">Total Variable Costs</th>
                <td class="totalVar init-val"></td>
                <td class="totalVar var-1"></td>
                <td class="totalVar mult-var-1"></td>
            </tr>
            <tr id="rowContMarg">
                <th class="rowTitle">Contribution Margin</th>
                <td class="contMarg init-val"></td>
                <td class="contMarg var-1"></td>
                <td class="contMarg mult-var-1"></td>
            </tr>
            <tr id="rowFixMan">
                <th class="rowTitle">Fixed Manufacturing Costs</th>
                <td class="fixMan init-val"></td>
                <td class="fixMan var-1"></td>
                <td class="fixMan mult-var-1"></td>
            </tr>
            <tr id="rowFixAd">
                <th class="rowTitle">Fixed Selling/Admin Costs</th>
                <td class="fixAd init-val"></td>
                <td class="fixAd var-1"></td>
                <td class="fixAd mult-var-1"></td>
            </tr>
            <tr id="rowTotalFix">
                <th class="rowTitle">Total Fixed Costs</th>
                <td class="totalFix init-val"></td>
                <td class="totalFix var-1"></td>
                <td class="totalFix mult-var-1"></td>
            </tr>
            <tr id="rowOpInc">
                <th class="rowTitle">Operating Income</th>
                <td class="opInc init-val"></td>
                <td class="opInc var-1"></td>
                <td class="opInc mult-var-1"></td>
            </tr>
        </tbody>
    </table>
</body>
