<!doctype html>
<html lang="en">

<head>
    <link rel="stylesheet" href="../css/stylesContributionMargin.css" />
    <script src="../js/ContributionIncomeStatement/contributionRechner.js"></script>
</head>

<body>
    <table>
        <thead>
            <tr id="colHeads">
                <th scope="col" class="colTitle">Type</th>
                <th scope="col" class="colTitle">Initial Value</th>
                <th scope="col" class="colTitle">Multiplier V 1</th>
                <th scope="col" class="colTitle">Variant 1</th>
            </tr>
        </thead>
        <tbody>
            <tr id="rowSales">
                <th class="rowTitle">Sales</th>
                <td><input class="sales init-val calc-value-col" type="number"></td>
                <td><input class="sales mult-var-1" type="number" step="0.1" value="1"></td>
                <td class="sales var-1"></td>
            </tr>
            <tr id="rowVarMan">
                <th class="rowTitle">Variable Manufacturing Costs</th>
                <td><input class="varMan init-val calc-value-col" type="number"></td>
                <td><input class="varMan mult-var-1" type="number" step="0.1" value="1"></td>
                <td class="varMan var-1"></td>
            </tr>
            <tr id="rowVarAd">
                <th class="rowTitle">Variable Selling/Admin Costs</th>
                <td><input class="varAd init-val calc-value-col" type="number"></td>
                <td><input class="varAd mult-var-1" type="number" step="0.1" value="1"></td>
                <td class="varAd var-1"></td>
            </tr>
            <tr id="rowTotalVar">
                <th class="rowTitle">Total Variable Costs</th>
                <td class="totalVar init-val"></td>
                <td class="totalVar mult-var-1"></td>
                <td class="totalVar var-1"></td>
            </tr>
            <tr id="rowContMarg">
                <th class="rowTitle">Contribution Margin</th>
                <td class="contMarg init-val"></td>
                <td class="contMarg mult-var-1"></td>
                <td class="contMarg var-1"></td>
            </tr>
            <tr id="rowFixMan">
                <th class="rowTitle">Fixed Manufacturing Costs</th>
                <td><input class="fixMan init-val calc-value-col" type="number"></td>
                <td><input class="fixMan mult-var-1" type="number" step="0.1" value="1"></td>
                <td class="fixMan var-1"></td>
            </tr>
            <tr id="rowFixAd">
                <th class="rowTitle">Fixed Selling/Admin Costs</th>
                <td><input class="fixAd init-val calc-value-col" type="number"></td>
                <td><input class="fixAd mult-var-1" type="number" step="0.1" value="1"></td>
                <td class="fixAd var-1"></td>
            </tr>
            <tr id="rowTotalFix">
                <th class="rowTitle">Total Fixed Costs</th>
                <td class="totalFix init-val"></td>
                <td class="totalFix mult-var-1"></td>
                <td class="totalFix var-1"></td>
            </tr>
            <tr id="rowOpInc">
                <th class="rowTitle">Operating Income</th>
                <td class="opInc init-val"></td>
                <td class="opInc mult-var-1"></td>
                <td class="opInc var-1"></td>
            </tr>
        </tbody>
    </table>
</body>
